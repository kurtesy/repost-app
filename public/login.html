<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Repost Dashboard — Sign in</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --border:#2a2f3a;
    --text:#e7e9ee; --muted:#9aa2b1; --accent:#6c8cff; --bad:#ff6b6b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       display:flex;align-items:center;justify-content:center;min-height:100vh}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:32px;width:100%;max-width:340px}
  h1{font-size:16px;margin:0 0 4px}
  .muted{color:var(--muted);font-size:13px;margin:0 0 20px}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
  input[type=password]{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);
       padding:9px 10px;border-radius:6px;font-size:14px;margin-bottom:14px}
  button{width:100%;background:var(--accent);color:#fff;border:none;border-radius:6px;padding:10px 14px;
       cursor:pointer;font-size:14px}
  button:disabled{opacity:.5;cursor:not-allowed}
  #error{color:var(--bad);font-size:13px;margin-top:12px;display:none}
</style>
</head>
<body>
<div class="card">
  <h1>Repost Dashboard</h1>
  <p class="muted">Enter the shared password to continue.</p>
  <form id="loginForm">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" autofocus required />
    <button type="submit" id="submitBtn">Sign in</button>
  </form>
  <div id="error"></div>
</div>
<script>
const form = document.getElementById('loginForm');
const errorEl = document.getElementById('error');
const submitBtn = document.getElementById('submitBtn');

// If a next= param points back at where the user was headed (set by the dashboard's own JS
// when it gets a 401), return there after a successful login; otherwise fall back to "/".
function getNextPath() {
  const params = new URLSearchParams(window.location.search);
  const next = params.get('next');
  return next && next.startsWith('/') ? next : '/';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorEl.style.display = 'none';
  submitBtn.disabled = true;
  submitBtn.textContent = 'Signing in...';
  try {
    const res = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: document.getElementById('password').value })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Sign in failed');
    window.location.href = getNextPath();
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.style.display = 'block';
    submitBtn.disabled = false;
    submitBtn.textContent = 'Sign in';
  }
});
</script>
</body>
</html>
